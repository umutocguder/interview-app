<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="interviewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="interviewGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="512" height="512" rx="128" fill="#0B0F19" />

  <!-- Outer Orbit Track -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#interviewGrad)" stroke-width="2.5" stroke-dasharray="14 18" opacity="0.4" />

  <!-- Dual Conversational AI Dialogue Bubbles -->
  <g transform="translate(256, 215)" filter="url(#interviewGlow)">
    <!-- Main Interviewer AI Bubble -->
    <path d="M -110 -85 C -110 -125, 40 -125, 40 -85 C 40 -45, 10 -45, -20 -45 L -65 -15 L -60 -45 C -90 -45, -110 -55, -110 -85 Z" fill="url(#interviewGrad)" />

    <!-- Waveform sound bars in interviewer bubble -->
    <rect x="-80" y="-95" width="6" height="20" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="-66" y="-105" width="6" height="40" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="-52" y="-112" width="6" height="54" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="-38" y="-100" width="6" height="30" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="-24" y="-90" width="6" height="12" rx="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Candidate Response Bubble (Interlocking) -->
    <path d="M 110 5 C 110 -35, -40 -35, -40 5 C -40 45, -10 45, 20 45 L 65 75 L 60 45 C 90 45, 110 35, 110 5 Z" fill="#1E293B" stroke="url(#interviewGrad)" stroke-width="4" />

    <!-- Checkmark inside Candidate bubble -->
    <polyline points="20,5 32,17 55,-6" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="256" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="#FFFFFF">INTERVIEW</text>
  <text x="256" y="412" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="8" fill="#38BDF8">AI MOCK SIMULATOR</text>
</svg>
